name: Security regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated SSH test binaries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q http_ctl server client/ctl client/ssh-proxy
      - run: bash -n examples/termux-phone-deploy.sh
